name: автотесты UI и API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ручной запуск
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Устанановить пакеты
        run: npm ci

      - name: Установить браузеры
        run: npx playwright install --with-deps

      - name: Запустить тесты
        # секреты приходят из GitHub Secrets и заменяют собой .env на CI
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          STUDWORK_LOGIN: ${{ secrets.STUDWORK_LOGIN }}
          STUDWORK_PASSWORD: ${{ secrets.STUDWORK_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STUDWORK_RECAPTCHA: ${{ secrets.STUDWORK_RECAPTCHA }}
        run: npx playwright test

      # сохраняем HTML-отчет как артефакт прогона.
      # if: always() - выгружаем даже если тесты упали
      - name: Сохранить HTML-отчет
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # упаковываем отчет в один zip-файл, чтобы отправить его в Telegram файлом.
      - name: Упаковать отчет в zip
        if: always()
        run: zip -r playwright-report.zip playwright-report

      # отправляем текстовое сообщение с итогом прогона в Telegram.
      # status берем из job.status: success/failure - его подставляет GitHub автоматически.
      - name: Отправить итог в Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>Автотесты Studwork</b>%0AСтатус прогона: <b>${{ job.status }}</b>%0AВетка: ${{ github.ref_name }}%0AКоммит: ${{ github.sha }}%0AЗапуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # отправляем сам zip-архив отчета файлом - его можно скачать из чата и открыть локально.
      - name: Отправить отчет-архив в Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@playwright-report.zip \
            -F caption="HTML-отчет Playwright (распакуй и открой index.html)"
