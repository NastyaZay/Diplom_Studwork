name: автотесты UI и API

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # ручной запуск
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Устанановить пакеты
        run: npm ci

      - name: Установить браузеры
        run: npx playwright install

      - name: Запустить тесты
        # секреты приходят из GitHub Secrets и заменяют собой .env на CI
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          STUDWORK_LOGIN: ${{ secrets.STUDWORK_LOGIN }}
          STUDWORK_PASSWORD: ${{ secrets.STUDWORK_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STUDWORK_RECAPTCHA: ${{ secrets.STUDWORK_RECAPTCHA }}
        run: npx playwright test

      # сохраняем HTML-отчет как артефакт прогона.
      # if: always() - выгружаем даже если тесты упали
      - name: Сохранить HTML-отчет
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # упаковываем отчет в один zip-файл, чтобы отправить его в Telegram файлом.
      - name: Упаковать отчет в zip
        if: always()
        run: zip -r playwright-report.zip playwright-report

      # считаем результаты из JSON-отчета и отправляем текстовый итог в Telegram.
      # jq уже есть на раннере. --data-urlencode сам кодирует текст и переносы строк.
      # -H "Expect:" убирает заголовок, из-за которого curl зависал (это и был exit 28).
      # -v включает подробный лог, чтобы при проблеме было видно, где затык.
      - name: Отправить итог в Telegram
        if: always()
        run: |
          # достаем счетчики из results.json (учитываем оба уровня вложенности suites)
          PASSED=$(jq '[.suites[].suites[]?.specs[]?, .suites[].specs[]?] | map(select(.tests[].results[].status == "passed")) | length' results.json 2>/dev/null || echo 0)
          FAILED=$(jq '[.suites[].suites[]?.specs[]?, .suites[].specs[]?] | map(select(.tests[].results[].status != "passed")) | length' results.json 2>/dev/null || echo 0)
          TOTAL=$((PASSED + FAILED))

          # собираем сообщение
          MESSAGE="<b>Автотесты Studwork</b>
          Статус прогона: <b>${{ job.status }}</b>
          Всего тестов: ${TOTAL}
          Успешно: ${PASSED}
          Упало: ${FAILED}
          Ветка: ${{ github.ref_name }}
          Коммит: ${{ github.sha }}
          Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -v --max-time 30 \
            -H "Expect:" \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

      # отправляем сам zip-архив отчета файлом - его можно скачать из чата и открыть локально.
      - name: Отправить отчет-архив в Telegram
        if: always()
        run: |
          curl --max-time 60 \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@playwright-report.zip \
            -F caption="HTML-отчет Playwright (распакуй и открой index.html)"
