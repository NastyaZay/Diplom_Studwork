name: автотесты UI и API

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: ТЕСТЫ
  # Крутится на self-hosted раннере (мой компьютер с рабочим VPN),
  # потому что без VPN тесты не достучатся до стенда studwork.
  # ============================================================
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Установить пакеты
        run: npm ci

      - name: Установить браузеры
        run: npx playwright install

      # ------------------------------------------------------------
      # ALLURE TESTOPS: ставим allurectl вручную.
      # Раньше пробовали официальный setup-allurectl, но на self-hosted
      # раннере он падает с "Resource not accessible by integration" -
      # ему не хватает прав дергать GitHub API. Ручная установка проще
      # и в GitHub API вообще не лезет: просто качаем бинарник и кладем
      # его в PATH через $GITHUB_PATH (эта папка станет видна следующим шагам).
      # Раннер на macOS arm64 (darwin/arm64) - качаем соответствующий файл.
      # ------------------------------------------------------------
      - name: Установить allurectl
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            ALLURECTL_FILE="allurectl_darwin_arm64"
          else
            ALLURECTL_FILE="allurectl_darwin_amd64"
          fi
          echo "Архитектура: $ARCH, качаю: $ALLURECTL_FILE"
          curl -L "https://github.com/allure-framework/allurectl/releases/latest/download/${ALLURECTL_FILE}" -o allurectl
          chmod +x allurectl
          # кладем текущую папку в PATH, чтобы дальше вызывать просто "allurectl"
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
          ./allurectl --version

      # ------------------------------------------------------------
      # ЗАПУСК ТЕСТОВ.
      # Схема простая и надежная: сначала ПРОГОНЯЕМ тесты, потом
      # ОТДЕЛЬНЫМ шагом заливаем готовую папку allure-results в TestOps.
      #
      # ALLURE_ENDPOINT / ALLURE_PROJECT_ID / ALLURE_TOKEN передаем сюда как env -
      # allurectl читает их автоматически из окружения (и на прогоне, и на заливке).
      # endpoint и id проекта - из Variables (vars.), токен - из Secrets.
      # ------------------------------------------------------------
      - name: Запустить тесты
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          STUDWORK_LOGIN: ${{ secrets.STUDWORK_LOGIN }}
          STUDWORK_PASSWORD: ${{ secrets.STUDWORK_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STUDWORK_RECAPTCHA: ${{ secrets.STUDWORK_RECAPTCHA }}
          # настройки TestOps - allurectl подхватит их сам из окружения
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: npx playwright test

      # ------------------------------------------------------------
      # ЗАЛИВКА РЕЗУЛЬТАТОВ В ALLURE TESTOPS.
      # allurectl берет готовую папку allure-results и заливает как один "Запуск".
      # if: always() - заливаем даже если часть тестов упала.
      #
      # Имя запуска задаем через переменную окружения ALLURE_LAUNCH_NAME, а НЕ через
      # флаг --launch-name в кавычках. Причина: в имени есть символ "#", а в bash "#"
      # начинает комментарий, из-за чего команда обрывалась (unexpected EOF).
      # Через env-переменную такой проблемы нет - bash не трогает ее содержимое.
      # ------------------------------------------------------------
      - name: Upload results to Allure TestOps
        if: always()
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          ALLURE_LAUNCH_NAME: "studwork ${{ github.ref_name }} run ${{ github.run_number }}"
        run: allurectl upload allure-results

      # упаковываем HTML-отчет в один zip-файл заранее, чтобы отдать его артефактом.
      # if: always() - делаем это даже если тесты упали.
      # Проверяем, что папка playwright-report существует: если тесты не дошли до
      # генерации отчета, папки не будет, и zip упал бы с ошибкой "Nothing to do".
      - name: Упаковать отчет в zip
        if: always()
        run: |
          if [ -d playwright-report ]; then
            zip -r playwright-report.zip playwright-report
          else
            echo "Папки playwright-report нет - отчет не сформирован, пропускаю упаковку"
          fi

      # выгружаем результаты в "камеру хранения" GitHub (артефакты прогона).
      # это то, что заберет второй job (notify) уже из чистого интернета.
      - name: Выгрузить результаты как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results.json
            playwright-report.zip
          retention-days: 14

  # ============================================================
  # JOB 2: УВЕДОМЛЕНИЕ В TELEGRAM
  # Крутится на облачном раннере ubuntu-latest.
  # needs: test  -> стартует ТОЛЬКО после того, как отработал test.
  # if: always() -> шлем уведомление даже если тесты упали.
  # ============================================================
  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      # скачиваем артефакт, который выгрузил job test (results.json + zip отчета).
      - name: Скачать результаты
        uses: actions/download-artifact@v4
        with:
          name: test-results

      # считаем результаты из results.json и отправляем текстовый итог в Telegram.
      - name: Отправить итог в Telegram
        run: |
          # достаем счетчики из results.json (учитываем оба уровня вложенности suites)
          PASSED=$(jq '[.suites[].suites[]?.specs[]?, .suites[].specs[]?] | map(select(.tests[].results[].status == "passed")) | length' results.json 2>/dev/null || echo 0)
          FAILED=$(jq '[.suites[].suites[]?.specs[]?, .suites[].specs[]?] | map(select(.tests[].results[].status != "passed")) | length' results.json 2>/dev/null || echo 0)
          TOTAL=$((PASSED + FAILED))

          MESSAGE="<b>Автотесты Studwork</b>
          Статус прогона тестов: <b>${{ needs.test.result }}</b>
          Всего тестов: ${TOTAL}
          Успешно: ${PASSED}
          Упало: ${FAILED}
          Ветка: ${{ github.ref_name }}
          Коммит: ${{ github.sha }}
          Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -v --max-time 30 \
            -H "Expect:" \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

      # отправляем сам zip-архив отчета файлом - его можно скачать из чата и открыть локально.
      # шлем архив ТОЛЬКО если прогон тестов упал (needs.test.result == 'failure').
      - name: Отправить отчет-архив в Telegram
        if: needs.test.result == 'failure'
        run: |
          curl --max-time 60 \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@playwright-report.zip \
            -F caption="HTML-отчет Playwright (распакуй и открой index.html)"
